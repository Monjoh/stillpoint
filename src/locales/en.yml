  notObject: 'Config is not an object.'
  noVersion: 'Config has no usable version number.'
  newer: 'This config was written by a newer version of Stillpoint (config version {found}, this build understands up to {supported}). Update the extension, then import it again.'

store:
  refused: 'Refused to save an invalid config. Your last change was not kept.'
