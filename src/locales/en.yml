  ink: 'Ink'
  dusk: 'Dusk'
  ember: 'Ember'
  moss: 'Moss'
  plum: 'Plum'
  slate: 'Slate'
  tide: 'Tide'
  paper: 'Paper'
  linen: 'Linen'

