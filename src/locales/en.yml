# Every user-facing string in Stillpoint. Built into _locales/en/messages.json by
# @wxt-dev/i18n; read at runtime with `i18n.t('area.key')` from '#i18n'.
#
# - Nested keys become `area_key` in messages.json. Keep keys stable: a translation is
#   keyed to them.
# - `$1`…`$9` are substitutions: i18n.t('key', [value]).
# - `{name}`: a named string substitution, i18n.t('key', { name: value }).
# - `[[name]]`: where an element goes (a link, a key cap). See src/lib/rich-text.tsx.
# - Plurals: `1: …` and `n: …`, then i18n.t('key', count).
# - The language follows the browser's. To add one, copy this file to <lang>.yml.

manifest:
  name: Stillpoint
  description: A quiet, personalizable new tab page.

# View mode: the new tab itself.
newtab:
  emptyHint: 'Press [[key]] to add a widget.'
  editLayout: 'Edit layout'
  firstRunHint: 'or press [[key]] to customise this page'
  gotIt: 'Got it'
  pageTitle: 'New Tab'

# Unsplash's required credit. [[name]] is the photographer, [[unsplash]] the word Unsplash as a link.
credit:
  photoBy: 'Photo by [[name]] on [[unsplash]]'

# Notices a widget's frame shows in its place.
frame:
  unavailable:
    title: 'Widget not available'
    detail: 'This profile uses "{type}", which this version of Stillpoint does not have. Its position and settings are kept.'
  unreadable:
    title: 'Settings could not be read'
    detail: '{name} has settings this version cannot interpret.'
  permission:
    title: '{name} needs your permission'
    hosts: 'It gets its data from {hosts}'
    data: 'It sends {what}'
    hostsAndData: 'It gets its data from {hosts} and sends {what}'
    inEditMode: '{what}. Leave edit mode to allow it.'
    askOnce: '{what}, which Firefox asks you to allow once.'
    allow: 'Allow'
  failed: '{name} failed'
  retry: 'Retry'
  remove: 'Remove'

# Completes "It sends …" for each kind of data Firefox asks consent for.
permission:
  locationInfo: 'the place you picked to its forecast service'
  searchTerms: 'your search words'

# Edit mode: the toolbar and the widget boxes.
edit:
  toolbar: 'Edit layout'
  addWidget: 'Add widget'
  profile: 'Profile'
  shortcuts: 'Keyboard shortcuts'
  settings: 'Settings'
  done: 'Done'
  widgetBox: '{name}, column {column}, row {row}, {width} by {height} cells'
  noRoom: 'There is no room for {name}. Make space by moving, shrinking or removing a widget.'
  dismiss: 'Dismiss'

# The keyboard shortcut list behind the toolbar's ? button.
shortcuts:
  lead: 'Drag a widget to move it, or its edges to resize it.'
  edit: 'Edit the layout'
  escape: 'Close the panel, then leave edit mode'
  move: 'Move the selected widget'
  resize: 'Resize it'
  remove: 'Remove it (or Backspace)'
  duplicate: 'Duplicate it (⌘ on a Mac)'
  search: 'Jump to the search box'

# Names printed on keys, as a keyboard in this language labels them.
keys:
  esc: 'Esc'
  shift: 'Shift'
  ctrl: 'Ctrl'
  delete: 'Delete'
  arrows: 'arrows'

picker:
  label: 'Add a widget'
  category:
    time: 'Time'
    info: 'Information'
    navigation: 'Navigation'
    productivity: 'Productivity'
    decoration: 'Decoration'

# Theme presets and the token editor. Keys are preset ids and token names.
theme:
  customise: 'Customise'
  changes:
    1: '$1 change'
    n: '$1 changes'
  resetAll: 'Reset all'
  reset: 'Reset'
  resetToken: 'Reset {name} to the theme’s'
  default: 'Theme default'
  preset:
    midnight:
      name: 'Midnight'
      description: 'Near-black and cool blue. High contrast, out of the way.'
    paper:
      name: 'Paper'
      description: 'Warm white and ink, set in a serif. For light backgrounds.'
    terminal:
      name: 'Terminal'
      description: 'Monospace throughout, phosphor green, no shadows, square corners.'
    glass:
      name: 'Glass'
      description: 'Frosted translucent surfaces. Built for photo backgrounds.'
  token:
    text:
      label: 'Text'
    textMuted:
      label: 'Muted text'
      help: 'Secondary lines — a date under a clock, a label under a value.'
    accent:
      label: 'Accent'
    surface:
      label: 'Widget surface'
      help: 'Shows on widgets with Card switched on in their Frame settings, as do border, shadow, blur and corner radius.'
    surfaceBorder:
      label: 'Widget border'
    shadow:
      label: 'Widget shadow'
    surfaceBlur:
      label: 'Surface blur'
      help: 'Frosts whatever is behind a widget’s surface. Costs nothing at 0.'
    fontDisplay:
      label: 'Display font'
    fontBody:
      label: 'Body font'
    fontMono:
      label: 'Monospace font'
    radius:
      label: 'Corner radius'
  shadow:
    none: 'None'
    subtle: 'Subtle'
    soft: 'Soft'
    strong: 'Strong'
  group:
    colour: 'Colour'
    type: 'Type'
    surface: 'Surface'

# Background gradient swatches, by id.
gradient:
