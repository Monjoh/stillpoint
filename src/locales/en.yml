    unreadable: 'That image could not be opened. JPEG, PNG, WebP and AVIF all work.'
    process: 'This browser could not process the image.'
    read: 'The image could not be read.'
    save: 'The photo could not be saved. There may not be enough storage space left.'

# Background: Lorem Picsum and Unsplash.
web:
  needsKey: 'Unsplash needs an access key, free from unsplash.com/developers: create an app and copy its Access Key. For photos with no setup, choose Lorem Picsum.'
